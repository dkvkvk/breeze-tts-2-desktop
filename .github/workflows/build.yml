name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'shell/**'
      - 'src/ui/**'
      - 'assets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      RUNTIME_VERSION: v0.1.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shell/package-lock.json

      - name: Fetch backend runtime (upstream Windows build)
        shell: pwsh
        run: |
          $url = "https://github.com/HoppouAI/Breeze-TTS-2.cpp/releases/download/$env:RUNTIME_VERSION/breeze-tts-2-$env:RUNTIME_VERSION-windows-x64-vulkan.zip"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile runtime.zip
          Expand-Archive runtime.zip -DestinationPath _runtime -Force
          $inner = Get-ChildItem _runtime -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force shell/runtime | Out-Null
          Copy-Item "$($inner.FullName)/*" shell/runtime -Recurse -Force
          if (-not (Test-Path 'shell/runtime/breeze-server.exe')) { throw 'runtime missing breeze-server.exe' }
          Get-ChildItem shell/runtime | Select-Object Name, Length | Format-Table

      - name: Install dependencies
        working-directory: shell
        run: npm ci

      - name: Test long-form synthesis and exports
        working-directory: shell
        run: npm test

      - name: Build NSIS installer
        working-directory: shell
        run: npm run dist

      - name: Prepare upgrade from 2.2.0
        shell: pwsh
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'legacy-2.2.0.exe'
          Invoke-WebRequest -Uri 'https://github.com/dkvkvk/breeze-tts-2-desktop/releases/download/v2.2.0/BreezeTTS2-Setup-2.2.0.exe' -OutFile $old
          if ((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash.ToLower() -ne '54591234de6ff6e43fd244f51ccdc7a114199a7c135f543bafc1b18bfad3f4ba') {
            throw 'Unexpected legacy installer checksum'
          }
          $setup = Start-Process -FilePath $old -ArgumentList '/S' -WindowStyle Hidden -PassThru
          if (-not $setup.WaitForExit(120000)) {
            Stop-Process -InputObject $setup -Force
            throw 'Legacy installation timed out'
          }
          if ($setup.ExitCode -ne 0 -or -not (Test-Path -LiteralPath 'D:\BreezeTTS2\Breeze TTS 2.exe')) {
            throw 'Legacy installation failed'
          }
          foreach ($relative in @('models/upgrade-check.gguf', 'voices/upgrade-check.breeze', 'design-presets.json', 'model-path.txt', 'ai-provider.json', 'chapter-jobs/upgrade-check/job.json', 'chapter-jobs/upgrade-check/turn.pcm')) {
            $fixture = Join-Path 'D:\BreezeTTS2' $relative
            New-Item -ItemType Directory -Path (Split-Path -Parent $fixture) -Force | Out-Null
            Set-Content -LiteralPath $fixture -Value 'upgrade fixture' -Encoding ascii
          }

      - name: Check installed app on first run
        shell: pwsh
        run: |
          $installer = Get-ChildItem out-electron/VoiceTrackStudio-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'installer not produced' }
          # The custom NSIS init sets this default even in silent mode.
          $installDir = 'D:\BreezeTTS2'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -WindowStyle Hidden -PassThru
          if (-not $setup.WaitForExit(120000)) {
            Stop-Process -InputObject $setup -Force
            throw 'silent installation timed out'
          }
          if ($setup.ExitCode -ne 0) { throw "installer exited with code $($setup.ExitCode)" }
          $app = Join-Path $installDir 'VoiceTrackStudio.exe'
          $backend = Join-Path $installDir 'resources/runtime/breeze-server.exe'
          if (-not (Test-Path -LiteralPath $app) -or -not (Test-Path -LiteralPath $backend)) {
            throw 'installed app or backend runtime missing'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'resources/agent/voicetrack-mcp.cjs'))) {
            throw 'installed MCP adapter missing'
          }
          foreach ($relative in @('models/upgrade-check.gguf', 'voices/upgrade-check.breeze', 'design-presets.json', 'model-path.txt', 'ai-provider.json', 'chapter-jobs/upgrade-check/job.json', 'chapter-jobs/upgrade-check/turn.pcm')) {
            $fixture = Join-Path $installDir $relative
            if ((Get-Content -LiteralPath $fixture -Raw).Trim() -ne 'upgrade fixture') {
              throw "Upgrade changed user data at $relative"
            }
          }
          if (Test-Path -LiteralPath "$installDir.voicetrack-backup") { throw 'Upgrade backup was not cleared after restoration' }
          $env:BREEZE_DATA = Join-Path $env:RUNNER_TEMP 'breeze-fresh-data'
          $report = Join-Path $env:RUNNER_TEMP 'breeze-selftest.txt'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $env:VOICETRACK_SELFTEST_SCREENSHOT = Join-Path $env:GITHUB_WORKSPACE 'out-electron/chapter-workbench.png'
          }
          $smoke = Start-Process -FilePath $app -ArgumentList '--selftest-offline' -RedirectStandardOutput $report -WindowStyle Hidden -PassThru
          if (-not $smoke.WaitForExit(30000)) {
            Stop-Process -InputObject $smoke -Force
            throw 'first-run self-test timed out'
          }
          Get-Content -LiteralPath $report
          if ($smoke.ExitCode -ne 0) { throw "first-run self-test exited with code $($smoke.ExitCode)" }

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem out-electron/*.exe | Select-Object -First 1
          if (-not $exe) { throw 'installer not produced' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$($exe.Name)  $([math]::Round($exe.Length / 1MB, 1)) MB"
          "sha256 $hash"
          Set-Content -LiteralPath out-electron/SHA256SUMS.txt -Value "$hash  $($exe.Name)" -Encoding ascii
          Add-Content $env:GITHUB_STEP_SUMMARY "- $($exe.Name) - $([math]::Round($exe.Length / 1MB, 1)) MB - sha256 $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceTrackStudio-Setup
          path: |
            out-electron/*.exe
            out-electron/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload chapter workbench preview
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: chapter-workbench-preview
          path: out-electron/chapter-workbench.png
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out-electron/*.exe
            out-electron/SHA256SUMS.txt
          generate_release_notes: true
