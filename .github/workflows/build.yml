name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'shell/**'
      - 'src/ui/**'
      - 'assets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      RUNTIME_VERSION: v0.1.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shell/package-lock.json

      - name: Fetch backend runtime (upstream Windows build)
        shell: pwsh
        run: |
          $url = "https://github.com/HoppouAI/Breeze-TTS-2.cpp/releases/download/$env:RUNTIME_VERSION/breeze-tts-2-$env:RUNTIME_VERSION-windows-x64-vulkan.zip"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile runtime.zip
          Expand-Archive runtime.zip -DestinationPath _runtime -Force
          $inner = Get-ChildItem _runtime -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force shell/runtime | Out-Null
          Copy-Item "$($inner.FullName)/*" shell/runtime -Recurse -Force
          if (-not (Test-Path 'shell/runtime/breeze-server.exe')) { throw 'runtime missing breeze-server.exe' }
          Get-ChildItem shell/runtime | Select-Object Name, Length | Format-Table

      - name: Install dependencies
        working-directory: shell
        run: npm ci

      - name: Build NSIS installer
        working-directory: shell
        run: npm run dist

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem out-electron/*.exe | Select-Object -First 1
          if (-not $exe) { throw 'installer not produced' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$($exe.Name)  $([math]::Round($exe.Length / 1MB, 1)) MB"
          "sha256 $hash"
          Add-Content $env:GITHUB_STEP_SUMMARY "- $($exe.Name) - $([math]::Round($exe.Length / 1MB, 1)) MB - sha256 $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: BreezeTTS2-Setup
          path: out-electron/*.exe
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out-electron/*.exe
          generate_release_notes: true
